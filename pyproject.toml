[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "orderfuse-pam"
version = "0.1.0"
description = "Preview evaluation utilities for order-consistent volumetric photoacoustic fusion"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "OrderFuse-PAM Contributors"}]
dependencies = ["numpy>=1.23"]

[tool.setuptools.packages.find]
include = ["orderfuse_pam*"]
